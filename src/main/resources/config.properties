# MyBot
#
# Your bot's token (discord.com/developers -> your app -> Bot -> Reset Token). Or set DISCORD_TOKEN.
discord-token=

# Your license key, from your purchase email or the store's download page. Or set LICENSE_KEY.
# If you downloaded this bot from BuiltByBit or Voxel Shop, the key is already built in: leave this empty.
license-key=

# How often the license is re-checked while the bot runs, in hours (0 = only at start-up).
recheck-hours=6
